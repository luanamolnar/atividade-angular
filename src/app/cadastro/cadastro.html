<section class="formulario">
  <h2>Cadastro</h2>

  <label>Nome</label>
  <input type="text" [(ngModel)]="nome" name="nome" />

  <label>E-mail</label>
  <input type="email" [(ngModel)]="email" name="email" />

  <label>Senha</label>
  <input type="password" [(ngModel)]="senha" name="senha" />

  <button (click)="cadastrar()">Cadastrar</button>
</section>
